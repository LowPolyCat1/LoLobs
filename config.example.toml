# Example configuration for LoLobs.
# To use it, rename this file to config.toml and keep it next to LoLobs.exe.
# Remove a key to use its default value.

# The IP address of the overlay server.
ip = "127.0.0.1"

# The port of the overlay server.
port = 2009

# The ranked queue that the overlay shows: "solo" (Ranked Solo/Duo) or "flex" (Ranked Flex).
queue = "solo"

# The maximum number of games in the match history, from 1 to 20.
match_limit = 5
