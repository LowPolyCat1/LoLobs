[package]
name = "LoLobs"
version = "0.1.0"
edition = "2024"

[dependencies]
irelia = { version = "0.11.2", features = ["full"] }
actix-web = "4.13.0"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
actix-files = "0.6.10"
rustls = { version = "0.23.40", features = ["ring"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
actix-ws = "0.4.0"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util"] }
